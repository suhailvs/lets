{% extends 'base.html' %}

{% block page_header %}
<div class="page-hero">
  <div>
    <p class="page-kicker">Join an exchange</p>
    <h1 class="page-title">Create your account and step into the network.</h1>
    <p class="page-subtitle">Use an existing exchange code to join the people already trading in your community.</p>
  </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-xl-7">
    <div class="surface-card">
      <form method="post" novalidate>
        {% include "registration/_signup_parts.html" %}
      </form>
    </div>
  </div>
</div>
{% endblock %}
