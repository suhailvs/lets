{% if is_paginated %}
<nav aria-label="Page navigation" class="mt-4">
  <ul class="pagination justify-content-center mb-0">
    {% if page_obj.has_previous %}
      <li class="page-item">
        <a class="page-link rounded-pill me-2" href="?page={{ page_obj.previous_page_number }}">Previous</a>
      </li>
    {% endif %}
    <li class="page-item active">
      <span class="page-link rounded-pill px-3">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    </li>
    {% if page_obj.has_next %}
      <li class="page-item">
        <a class="page-link rounded-pill ms-2" href="?page={{ page_obj.next_page_number }}">Next</a>
      </li>
    {% endif %}
  </ul>
</nav>
{% endif %}
