{% load crispy_forms_tags %}
{% csrf_token %}
<input type="hidden" name="next" value="{{ next }}" />
{{ form|crispy }}
<div class="surface-card p-4 my-4" style="background: rgba(23, 50, 77, 0.03);">
  <h3 class="h6 fw-bold mb-3">Account terms</h3>
  <ul class="mb-0 text-secondary">
    <li>All new accounts start with a zero balance.</li>
    <li>You can trade within the credit and debit limits of the exchange.</li>
    <li>Members should check balances before confirming a transaction.</li>
  </ul>
</div>
<button type="submit" class="btn btn-dark rounded-pill px-4">Sign up</button>
